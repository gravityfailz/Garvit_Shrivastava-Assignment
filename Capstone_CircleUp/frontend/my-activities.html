<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>My Activities — CircleUp</title>
    <link
      rel="stylesheet"
      href="./css/style.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      defer
    ></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a
          href="./activities.html"
          class="navbar-brand"
          ><div class="brand-icon">🌐</div>
          CircleUp</a
        >
        <ul class="navbar-nav">
          <li><a href="./activities.html">🏠 Browse</a></li>
          <li>
            <a
              href="./my-activities.html"
              class="active"
              >📋 My Activities</a
            >
          </li>
          <li><a href="./profile.html">👤 Profile</a></li>
        </ul>
        <div class="navbar-actions">
          <a
            href="./profile.html"
            class="user-pill"
          >
            <div
              class="avatar"
              id="nav-initials"
            >
              ?
            </div>
            <span
              class="user-pill-name"
              id="nav-user-name"
              >Me</span
            >
          </a>
          <button
            class="btn btn-ghost btn-sm"
            onclick="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="container page-content">
      <div class="page-header">
        <div>
          <h1>My Activities</h1>
          <p>Created, joined, and pending requests.</p>
        </div>
        <a
          href="./activities.html"
          class="btn btn-primary"
          >+ Create Activity</a
        >
      </div>

      <div class="tabs">
        <button
          class="tab-btn active"
          id="tab-created"
          onclick="switchTab('created')"
        >
          📅 Created
        </button>
        <button
          class="tab-btn"
          id="tab-joined"
          onclick="switchTab('joined')"
        >
          ✅ Joined
        </button>
        <button
          class="tab-btn"
          id="tab-requests"
          onclick="switchTab('requests')"
        >
          📩 My Requests
        </button>
      </div>

      <div
        id="alert"
        class="alert"
      ></div>
      <div id="tab-content">
        <div class="loading">
          <div class="spinner"></div>
          Loading…
        </div>
      </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script>
      requireAuth();

      const CATEGORY_CONFIG = {
        "Cricket Match": { emoji: "🏏", cls: "cat-cricket" },
        "Badminton Session": { emoji: "🏸", cls: "cat-badminton" },
        "Cafe Meetup": { emoji: "☕", cls: "cat-cafe" },
        "Movie Plan": { emoji: "🎬", cls: "cat-movie" },
        "Study Group": { emoji: "📚", cls: "cat-study" },
        "Weekend Trip": { emoji: "🌄", cls: "cat-trip" },
        Other: { emoji: "🎯", cls: "cat-other" },
      };
      function catConfig(c) {
        return CATEGORY_CONFIG[c] || { emoji: "🎯", cls: "cat-other" };
      }

      /* Days-away pill  */
      function daysAwayPill(dateStr, timeStr) {
        const now = new Date();
        const then = new Date(dateStr + "T" + timeStr);
        const diff = Math.ceil((then - now) / (1000 * 60 * 60 * 24));
        if (diff <= 0) return "";
        if (then - now < 86400000)
          return `<span class="days-away-pill today">Today</span>`;
        if (diff <= 3)
          return `<span class="days-away-pill soon">In ${diff} day${diff > 1 ? "s" : ""}</span>`;
        return `<span class="days-away-pill">In ${diff} days</span>`;
      }

      let currentTab = "created";

      async function init() {
        try {
          const me = await apiRequest("/users/me");
          renderNavUser(me.name);
        } catch (_) {}
        loadTab("created");
      }

      function switchTab(tab) {
        currentTab = tab;
        ["created", "joined", "requests"].forEach((t) =>
          document
            .getElementById(`tab-${t}`)
            .classList.toggle("active", t === tab),
        );
        loadTab(tab);
      }

      async function loadTab(tab) {
        const c = document.getElementById("tab-content");
        c.innerHTML =
          '<div class="loading"><div class="spinner"></div>Loading…</div>';
        try {
          if (tab === "created") {
            const data = await apiRequest("/users/me/activities");
            renderSplitActivityList(c, data, {
              emptyIcon: "🎯",
              emptyTitle: "No activities created yet",
              emptyMsg: "Create your first activity!",
            });
          } else if (tab === "joined") {
            const data = await apiRequest("/users/me/joined");
            renderSplitActivityList(c, data, {
              emptyIcon: "🤝",
              emptyTitle: "No joined activities yet",
              emptyMsg: "Browse activities and request to join one!",
            });
          } else {
            const data = await apiRequest("/users/me/requests");
            renderRequestList(c, data);
          }

          if (typeof gsap !== "undefined")
            gsap.from(
              "#tab-content .activity-card, #tab-content .request-card",
              {
                y: 20,
                opacity: 0,
                stagger: 0.06,
                duration: 0.4,
                ease: "power2.out",
              },
            );
        } catch (err) {
          c.innerHTML = `<div class="alert alert-error show">${esc(err.detail || "Failed to load.")}</div>`;
        }
      }

      /* ── Split into upcoming / past sections ──────────────── */
      function renderSplitActivityList(container, activities, opts) {
        if (!activities.length) {
          container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${opts.emptyIcon}</div>
        <h3>${opts.emptyTitle}</h3>
        <p>${opts.emptyMsg}</p>
        <a href="./activities.html" class="btn btn-primary" style="margin-top:16px;">Browse Activities</a>
      </div>`;
          return;
        }

        /* Split */
        const active = activities.filter(
          (a) => a.status === "open" || a.status === "full",
        );
        const past = activities.filter(
          (a) => a.status === "completed" || a.status === "cancelled",
        );

        /* Sort active: upcoming first */
        active.sort(
          (a, b) =>
            new Date(a.date + "T" + a.time) - new Date(b.date + "T" + b.time),
        );

        /* Sort past: most recent first */
        past.sort(
          (a, b) =>
            new Date(b.date + "T" + b.time) - new Date(a.date + "T" + a.time),
        );

        let html = "";

        if (active.length) {
          html += `
      <div class="activities-section" id="ma-active">
        <div class="section-header">
          <div class="section-title">
            <span class="section-title-dot section-title-dot-green"></span>
            Upcoming
          </div>
          <span class="section-count">${active.length} ${active.length === 1 ? "event" : "events"}</span>
        </div>
        <div class="activities-grid">
          ${active.map((a) => buildCard(a, true)).join("")}
        </div>
      </div>`;
        }

        if (past.length) {
          if (active.length) html += '<hr class="section-divider">';
          html += `
      <div class="activities-section section-past" id="ma-past">
        <div class="section-header">
          <div class="section-title">
            <span class="section-title-dot section-title-dot-grey"></span>
            Past &amp; Cancelled
          </div>
          <span class="section-count">${past.length} ${past.length === 1 ? "event" : "events"}</span>
        </div>
        <div class="activities-grid">
          ${past.map((a) => buildCard(a, false)).join("")}
        </div>
      </div>`;
        }

        container.innerHTML = html;
      }

      function buildCard(a, showPill) {
        const { emoji, cls } = catConfig(a.category);
        const pill = showPill ? daysAwayPill(a.date, a.time) : "";
        return `
    <a class="activity-card" href="./activity-detail.html?id=${a.id}">
      <div class="cat-img ${cls}">${emoji}</div>
      <div class="activity-card-body">
        <div class="activity-card-top">
          <div class="activity-card-title">${esc(a.title)}</div>
          ${statusBadge(a.status)}
        </div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;">
          <span class="badge badge-category">${esc(a.category)}</span>
          ${pill}
        </div>
        <div class="activity-card-meta">
          <div class="meta-item"><span class="meta-icon">📍</span>${esc(a.location)}</div>
          <div class="meta-item"><span class="meta-icon">📅</span>${fmtDate(a.date)} at ${fmtTime(a.time)}</div>
        </div>
        <div class="activity-card-footer">
          <span>👥 ${a.approved_participants_count} / ${a.max_participants} joined</span>
        </div>
      </div>
    </a>`;
      }

      /* ── My Requests tab — split by status ──────────────── */
      function renderRequestList(container, requests) {
        if (!requests.length) {
          container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">📩</div>
        <h3>No requests yet</h3>
        <p>Browse activities and request to join one!</p>
        <a href="./activities.html" class="btn btn-primary" style="margin-top:16px;">Browse Activities</a>
      </div>`;
          return;
        }

        /* Split by status */
        const pending = requests.filter((r) => r.status === "pending");
        const approved = requests.filter((r) => r.status === "approved");
        const rejected = requests.filter((r) => r.status === "rejected");

        function requestSection(items, title, icon, colorClass) {
          if (!items.length) return "";
          return `
      <div class="activities-section" style="margin-bottom:28px;">
        <div class="section-header">
          <div class="section-title" style="color:${colorClass};">
            ${icon} ${title}
          </div>
          <span class="section-count">${items.length}</span>
        </div>
        <div class="request-list">
          ${items.map((r) => requestCard(r)).join("")}
        </div>
      </div>`;
        }

        let html = "";
        html += requestSection(
          pending,
          "Pending Approval",
          "⏳",
          "var(--warning)",
        );
        if (pending.length && approved.length)
          html += '<hr class="section-divider">';
        html += requestSection(approved, "Approved", "✅", "var(--success)");
        if ((pending.length || approved.length) && rejected.length)
          html += '<hr class="section-divider">';
        html += requestSection(rejected, "Not Approved", "❌", "var(--text-2)");

        container.innerHTML = html;
      }

      function requestCard(r) {
        return `
    <div class="request-card">
      <a href="./activity-detail.html?id=${r.activity_id}" class="request-activity-link">
        <div class="request-card-top">
          <div>
            <div class="request-activity-title">${esc(r.activity_title)}</div>
            <span class="badge badge-category">${esc(r.activity_category)}</span>
          </div>
          <span class="badge badge-${r.status}">${r.status}</span>
        </div>
        <div class="activity-card-meta" style="margin-top:8px;">
          <div class="meta-item"><span class="meta-icon">📍</span>${esc(r.activity_location)}</div>
          <div class="meta-item"><span class="meta-icon">📅</span>${fmtDate(r.activity_date)} at ${fmtTime(r.activity_time)}</div>
        </div>
      </a>
      ${
        r.organizer_phone
          ? `
      <div class="contact-box" style="margin-top:12px;">
        <span class="contact-icon">📱</span>
        <span><strong>Organizer (${esc(r.organizer_name)}):</strong> ${esc(r.organizer_phone)}</span>
      </div>`
          : ""
      }
    </div>`;
      }

      init();
    </script>
  </body>
</html>
