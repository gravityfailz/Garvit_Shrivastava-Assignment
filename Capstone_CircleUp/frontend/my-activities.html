<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>My Activities — CircleUp</title>
    <link
      rel="stylesheet"
      href="./css/style.css"
    />
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a
          href="./activities.html"
          class="navbar-brand"
        >
          <div class="brand-icon">🌐</div>
          CircleUp
        </a>
        <ul class="navbar-nav">
          <li><a href="./activities.html">🏠 Browse</a></li>
          <li>
            <a
              href="./my-activities.html"
              class="active"
              >📋 My Activities</a
            >
          </li>
          <li><a href="./profile.html">👤 Profile</a></li>
        </ul>
        <div class="navbar-actions">
          <a
            href="./profile.html"
            class="user-pill"
          >
            <div
              class="avatar"
              id="nav-initials"
            >
              ?
            </div>
            <span
              class="user-pill-name"
              id="nav-user-name"
              >Me</span
            >
          </a>
          <button
            class="btn btn-ghost btn-sm"
            onclick="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="container page-content">
      <div class="page-header">
        <div>
          <h1>My Activities</h1>
          <p>
            All your created activities, joined activities, and pending
            requests.
          </p>
        </div>
        <a
          href="./activities.html"
          class="btn btn-primary"
          >+ Create Activity</a
        >
      </div>

      <div class="tabs">
        <button
          class="tab-btn active"
          id="tab-created"
          onclick="switchTab('created')"
        >
          📅 Activities I Created
        </button>
        <button
          class="tab-btn"
          id="tab-joined"
          onclick="switchTab('joined')"
        >
          ✅ Activities I Joined
        </button>
        <button
          class="tab-btn"
          id="tab-requests"
          onclick="switchTab('requests')"
        >
          📩 My Requests
        </button>
      </div>

      <div
        id="alert"
        class="alert"
      ></div>
      <div id="tab-content">
        <div class="loading">
          <div class="spinner"></div>
          Loading…
        </div>
      </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script>
      requireAuth();

      let currentTab = "created";

      async function init() {
        try {
          const me = await apiRequest("/users/me");
          renderNavUser(me.name);
        } catch (_) {}
        loadTab("created");
      }

      function switchTab(tab) {
        currentTab = tab;
        ["created", "joined", "requests"].forEach((t) => {
          document
            .getElementById(`tab-${t}`)
            .classList.toggle("active", t === tab);
        });
        loadTab(tab);
      }

      async function loadTab(tab) {
        const container = document.getElementById("tab-content");
        container.innerHTML =
          '<div class="loading"><div class="spinner"></div>Loading…</div>';
        hideAlert("alert");

        try {
          if (tab === "created") {
            const data = await apiRequest("/users/me/activities");
            renderActivityList(container, data, true);
          } else if (tab === "joined") {
            const data = await apiRequest("/users/me/joined");
            renderActivityList(container, data, false);
          } else {
            const data = await apiRequest("/users/me/requests");
            renderRequestList(container, data);
          }
        } catch (err) {
          container.innerHTML = `<div class="alert alert-error show">${esc(err.detail || "Failed to load.")}</div>`;
        }
      }

      function renderActivityList(container, activities, isCreated) {
        if (!activities.length) {
          container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">${isCreated ? "🎯" : "🤝"}</div>
          <h3>${isCreated ? "No activities created yet" : "No joined activities yet"}</h3>
          <p>${isCreated ? "Create your first activity to get started." : "Join activities to see them here."}</p>
          <a href="./activities.html" class="btn btn-primary" style="margin-top:16px">Browse Activities</a>
        </div>`;
          return;
        }

        container.innerHTML = `<div class="activities-grid">${activities.map((a) => activityCard(a)).join("")}</div>`;
      }

      function activityCard(a) {
        return `
      <a class="activity-card" href="./activity-detail.html?id=${a.id}">
        <div class="activity-card-body">
          <div class="activity-card-top">
            <div class="activity-card-title">${esc(a.title)}</div>
            ${statusBadge(a.status)}
          </div>
          <span class="badge badge-category">${esc(a.category)}</span>
          <div class="activity-card-meta">
            <div class="meta-item"><span class="meta-icon">📍</span>${esc(a.location)}</div>
            <div class="meta-item"><span class="meta-icon">📅</span>${fmtDate(a.date)} at ${fmtTime(a.time)}</div>
          </div>
          <div class="activity-card-footer">
            <span>👥 ${a.approved_participants_count} / ${a.max_participants} joined</span>
          </div>
        </div>
      </a>`;
      }

      function renderRequestList(container, requests) {
        if (!requests.length) {
          container.innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">📩</div>
          <h3>No participation requests yet</h3>
          <p>Browse activities and request to join one!</p>
          <a href="./activities.html" class="btn btn-primary" style="margin-top:16px">Browse Activities</a>
        </div>`;
          return;
        }

        const rows = requests.map((r) => {
          const statusClass = `badge-${r.status}`;
          const phone = r.organizer_phone
            ? `<div class="contact-box" style="margin-top:10px;">
             <span class="contact-icon">📱</span>
             <span><strong>Organizer:</strong> ${esc(r.organizer_name)} — ${esc(r.organizer_phone)}</span>
           </div>`
            : "";
          return `
        <div class="request-card">
          <a href="./activity-detail.html?id=${r.activity_id}" class="request-activity-link">
            <div class="request-card-top">
              <div>
                <div class="request-activity-title">${esc(r.activity_title)}</div>
                <span class="badge badge-category">${esc(r.activity_category)}</span>
              </div>
              <span class="badge ${statusClass}">${r.status}</span>
            </div>
            <div class="activity-card-meta" style="margin-top:8px;">
              <div class="meta-item"><span class="meta-icon">📍</span>${esc(r.activity_location)}</div>
              <div class="meta-item"><span class="meta-icon">📅</span>${fmtDate(r.activity_date)} at ${fmtTime(r.activity_time)}</div>
            </div>
          </a>
          ${phone}
        </div>`;
        });

        container.innerHTML = `<div class="request-list">${rows.join("")}</div>`;
      }

      init();
    </script>
  </body>
</html>
