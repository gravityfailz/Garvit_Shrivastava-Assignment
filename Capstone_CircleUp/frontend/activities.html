<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Activities — CircleUp</title>
    <link
      rel="stylesheet"
      href="./css/style.css"
    />
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      defer
    ></script>
  </head>
  <body>
    <nav class="navbar">
      <div class="container navbar-inner">
        <a
          href="./activities.html"
          class="navbar-brand"
        >
          <div class="brand-icon">🌐</div>
          CircleUp
        </a>
        <ul class="navbar-nav">
          <li>
            <a
              href="./activities.html"
              class="active"
              >🏠 Browse</a
            >
          </li>
          <li><a href="./my-activities.html">📋 My Activities</a></li>
          <li><a href="./profile.html">👤 Profile</a></li>
        </ul>
        <div class="navbar-actions">
          <a
            href="./profile.html"
            class="user-pill"
          >
            <div
              class="avatar"
              id="nav-initials"
            >
              ?
            </div>
            <span
              class="user-pill-name"
              id="nav-user-name"
              >Me</span
            >
          </a>
          <button
            class="btn btn-ghost btn-sm"
            onclick="logout()"
          >
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="container page-content">
      <div class="page-header">
        <div>
          <h1>Browse Activities</h1>
          <p>Find and join activities happening around you.</p>
        </div>
        <button
          class="btn btn-primary"
          onclick="openCreateModal()"
        >
          + Create Activity
        </button>
      </div>

      <!-- Filter Bar -->
      <div
        class="filter-bar"
        id="filter-bar"
      >
        <div class="filter-bar-title">🔍 Filter & Sort</div>
        <div class="filter-row">
          <div class="filter-group">
            <label>Category</label>
            <select
              id="f-category"
              class="form-control"
            >
              <option value="">All Categories</option>
              <option>Cricket Match</option>
              <option>Badminton Session</option>
              <option>Cafe Meetup</option>
              <option>Movie Plan</option>
              <option>Study Group</option>
              <option>Weekend Trip</option>
              <option>Other</option>
            </select>
          </div>
          <div class="filter-group">
            <label>Location</label>
            <div
              class="city-dropdown"
              id="f-loc-dd"
            >
              <div class="city-input-wrap">
                <span class="city-search-icon">🔍</span>
                <input
                  id="f-location"
                  type="text"
                  class="form-control city-input"
                  placeholder="Search city…"
                  autocomplete="off"
                />
                <span class="city-arrow">
                  <svg
                    width="12"
                    height="8"
                    viewBox="0 0 12 8"
                    fill="none"
                  >
                    <path
                      d="M1 1.5l5 5 5-5"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
              </div>
              <div
                class="city-list"
                id="f-location-list"
              ></div>
            </div>
          </div>
          <div class="filter-group">
            <label>Date</label>
            <input
              id="f-date"
              type="date"
              class="form-control"
            />
          </div>
          <div class="filter-group">
            <label>Sort</label>
            <select
              id="f-sort"
              class="form-control"
            >
              <option value="desc">Newest First</option>
              <option value="asc">Oldest First</option>
            </select>
          </div>
          <div class="filter-actions">
            <button
              class="btn btn-primary btn-sm"
              onclick="applyFilters()"
            >
              Apply
            </button>
            <button
              class="btn btn-ghost btn-sm"
              onclick="clearFilters()"
            >
              Clear
            </button>
          </div>
        </div>
      </div>

      <div class="tabs">
        <button
          class="tab-btn active"
          id="tab-all"
          onclick="switchTab('all')"
        >
          All Activities
        </button>
        <button
          class="tab-btn"
          id="tab-mine"
          onclick="switchTab('mine')"
        >
          My Activities
        </button>
      </div>

      <div
        id="alert"
        class="alert"
      ></div>
      <div id="activities-container">
        <div class="loading">
          <div class="spinner"></div>
          Loading activities…
        </div>
      </div>
    </div>

    <!-- Create Activity Modal -->
    <div
      class="modal-overlay"
      id="create-modal"
    >
      <div class="modal">
        <div class="modal-header">
          <h3>✨ Create New Activity</h3>
          <button
            class="modal-close"
            onclick="closeCreateModal()"
          >
            ✕
          </button>
        </div>
        <div class="modal-body">
          <div
            id="create-alert"
            class="alert"
          ></div>
          <form
            id="create-form"
            novalidate
          >
            <div class="form-group">
              <label
                class="form-label"
                for="c-title"
                >Title <span class="req">*</span></label
              >
              <input
                id="c-title"
                type="text"
                class="form-control"
                placeholder="e.g. Sunday Cricket Match"
                required
              />
            </div>
            <div class="form-row">
              <div class="form-group">
                <label
                  class="form-label"
                  for="c-category"
                  >Category <span class="req">*</span></label
                >
                <select
                  id="c-category"
                  class="form-control"
                  required
                >
                  <option value="">Select category…</option>
                  <option>Cricket Match</option>
                  <option>Badminton Session</option>
                  <option>Cafe Meetup</option>
                  <option>Movie Plan</option>
                  <option>Study Group</option>
                  <option>Weekend Trip</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="form-group">
                <label
                  class="form-label"
                  for="c-max"
                  >Max Participants <span class="req">*</span></label
                >
                <input
                  id="c-max"
                  type="number"
                  class="form-control"
                  min="1"
                  placeholder="e.g. 10"
                  required
                />
              </div>
            </div>
            <div class="form-group">
              <label class="form-label"
                >Location <span class="req">*</span></label
              >
              <div
                class="city-dropdown"
                id="c-loc-dd"
              >
                <div class="city-input-wrap">
                  <span class="city-search-icon">🔍</span>
                  <input
                    id="c-location"
                    type="text"
                    class="form-control city-input"
                    placeholder="Search or type a city / venue…"
                    autocomplete="off"
                    required
                  />
                  <span class="city-arrow">
                    <svg
                      width="12"
                      height="8"
                      viewBox="0 0 12 8"
                      fill="none"
                    >
                      <path
                        d="M1 1.5l5 5 5-5"
                        stroke="currentColor"
                        stroke-width="1.8"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </span>
                </div>
                <div
                  class="city-list"
                  id="c-location-list"
                ></div>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label
                  class="form-label"
                  for="c-date"
                  >Date <span class="req">*</span></label
                >
                <input
                  id="c-date"
                  type="date"
                  class="form-control"
                  required
                />
              </div>
              <div class="form-group">
                <label
                  class="form-label"
                  for="c-time"
                  >Time <span class="req">*</span></label
                >
                <input
                  id="c-time"
                  type="time"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div
              id="datetime-hint"
              style="margin-top: -10px; margin-bottom: 14px; display: none"
            >
              <div
                class="alert alert-warning show"
                style="margin: 0; padding: 9px 12px; font-size: 0.82rem"
              >
                ⏰ The selected date/time is in the past. Please choose a future
                time.
              </div>
            </div>
            <div class="form-group">
              <label
                class="form-label"
                for="c-desc"
                >Description</label
              >
              <textarea
                id="c-desc"
                class="form-control"
                placeholder="Describe your activity…"
                rows="3"
              ></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-ghost"
            onclick="closeCreateModal()"
          >
            Cancel
          </button>
          <button
            id="create-btn"
            class="btn btn-primary"
            onclick="submitCreate()"
          >
            Create Activity
          </button>
        </div>
      </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script src="./js/validation.js"></script>
    <script src="./js/city-dropdown.js"></script>
    <script>
      requireAuth();

      const CATEGORY_CONFIG = {
        "Cricket Match": { emoji: "🏏", cls: "cat-cricket" },
        "Badminton Session": { emoji: "🏸", cls: "cat-badminton" },
        "Cafe Meetup": { emoji: "☕", cls: "cat-cafe" },
        "Movie Plan": { emoji: "🎬", cls: "cat-movie" },
        "Study Group": { emoji: "📚", cls: "cat-study" },
        "Weekend Trip": { emoji: "🌄", cls: "cat-trip" },
        Other: { emoji: "🎯", cls: "cat-other" },
      };
      function catConfig(c) {
        return CATEGORY_CONFIG[c] || { emoji: "🎯", cls: "cat-other" };
      }

      let allActivities = [],
        currentUserId = null,
        currentTab = "all";

      async function init() {
        try {
          const me = await apiRequest("/users/me");
          currentUserId = me.id;
          renderNavUser(me.name);
        } catch (_) {}

        /* ── Date constraints ── */
        const todayStr = new Date().toISOString().split("T")[0];
        document.getElementById("c-date").min = todayStr;

        /* ── Live date/time validation ── */
        function checkDatetime() {
          const date = document.getElementById("c-date").value;
          const time = document.getElementById("c-time").value;
          const hint = document.getElementById("datetime-hint");
          const dateEl = document.getElementById("c-date");
          const timeEl = document.getElementById("c-time");
          if (date && time) {
            const past = !isFutureDatetime(date, time);
            hint.style.display = past ? "" : "none";
            dateEl.classList.toggle("input-invalid", past);
            timeEl.classList.toggle("input-invalid", past);
            dateEl.classList.toggle("input-valid", !past);
            timeEl.classList.toggle("input-valid", !past);
          } else {
            hint.style.display = "none";
          }
        }

        document
          .getElementById("c-date")
          .addEventListener("change", checkDatetime);
        document
          .getElementById("c-time")
          .addEventListener("change", checkDatetime);

        await loadActivities();

        /* ── Init city dropdowns ── */
        initCityDropdown("c-location", "c-location-list");
        initCityDropdown("f-location", "f-location-list");

        if (typeof gsap !== "undefined")
          gsap.from("#filter-bar", {
            y: -20,
            opacity: 0,
            duration: 0.5,
            ease: "power2.out",
          });
      }

      function buildQS() {
        const p = new URLSearchParams();
        const cat = document.getElementById("f-category").value;
        const loc = document.getElementById("f-location").value.trim();
        const date = document.getElementById("f-date").value;
        const sort = document.getElementById("f-sort").value;
        if (cat) p.set("category", cat);
        if (loc) p.set("location", loc);
        if (date) p.set("date", date);
        if (sort) p.set("sort_by_date", sort);
        const qs = p.toString();
        return qs ? "?" + qs : "";
      }

      async function loadActivities() {
        document.getElementById("activities-container").innerHTML =
          '<div class="loading"><div class="spinner"></div>Loading…</div>';
        try {
          allActivities = await apiRequest("/activities" + buildQS());
          renderActivities();
        } catch (err) {
          document.getElementById("activities-container").innerHTML =
            `<div class="alert alert-error show">${esc(err.detail || "Failed to load.")}</div>`;
        }
      }

      function applyFilters() {
        loadActivities();
      }
      function clearFilters() {
        document.getElementById("f-category").value = "";
        document.getElementById("f-location").value = "";
        document.getElementById("f-date").value = "";
        document.getElementById("f-sort").value = "desc";
        loadActivities();
      }

      function switchTab(tab) {
        currentTab = tab;
        document
          .getElementById("tab-all")
          .classList.toggle("active", tab === "all");
        document
          .getElementById("tab-mine")
          .classList.toggle("active", tab === "mine");
        renderActivities();
      }

      function renderActivities() {
        const list =
          currentTab === "mine"
            ? allActivities.filter((a) => a.creator_id === currentUserId)
            : allActivities;
        const c = document.getElementById("activities-container");
        if (!list.length) {
          c.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${currentTab === "mine" ? "🎯" : "🔍"}</div>
        <h3>${currentTab === "mine" ? "No activities created yet" : "Nothing found"}</h3>
        <p>${currentTab === "mine" ? "Create your first activity!" : "Try adjusting your filters."}</p>
      </div>`;
          return;
        }
        c.innerHTML = `<div class="activities-grid">${list
          .map((a) => {
            const { emoji, cls } = catConfig(a.category);
            const isOwner = a.creator_id === currentUserId;
            return `
      <a class="activity-card" href="./activity-detail.html?id=${a.id}">
        <div class="cat-img ${cls}">${emoji}</div>
        <div class="activity-card-body">
          <div class="activity-card-top">
            <div class="activity-card-title">${esc(a.title)}</div>
            ${statusBadge(a.status)}
          </div>
          <span class="badge badge-category">${esc(a.category)}</span>
          <div class="activity-card-meta">
            <div class="meta-item"><span class="meta-icon">📍</span>${esc(a.location)}</div>
            <div class="meta-item"><span class="meta-icon">📅</span>${fmtDate(a.date)} at ${fmtTime(a.time)}</div>
          </div>
          <div class="activity-card-footer">
            <span>👥 ${a.approved_participants_count} / ${a.max_participants} joined</span>
            ${isOwner ? '<span style="color:var(--primary);font-weight:700;font-size:.75rem;">⭐ Yours</span>' : ""}
          </div>
        </div>
      </a>`;
          })
          .join("")}</div>`;
        if (typeof gsap !== "undefined") {
          gsap.from(".activity-card", {
            y: 32,
            opacity: 0,
            stagger: 0.06,
            duration: 0.45,
            ease: "power2.out",
          });
          document.querySelectorAll(".activity-card").forEach((card) => {
            card.addEventListener("mouseenter", () =>
              gsap.to(card, { y: -6, duration: 0.22, ease: "power2.out" }),
            );
            card.addEventListener("mouseleave", () =>
              gsap.to(card, { y: 0, duration: 0.22, ease: "power2.out" }),
            );
          });
        }
      }

      function openCreateModal() {
        document.getElementById("create-modal").classList.add("open");
        document.getElementById("create-form").reset();
        hideAlert("create-alert");
        document.getElementById("datetime-hint").style.display = "none";
        ["c-date", "c-time", "c-location"].forEach((id) => {
          const el = document.getElementById(id);
          el.classList.remove("input-valid", "input-invalid");
        });
        if (typeof gsap !== "undefined")
          gsap.from(".modal", {
            scale: 0.93,
            opacity: 0,
            duration: 0.28,
            ease: "power2.out",
          });
      }
      function closeCreateModal() {
        document.getElementById("create-modal").classList.remove("open");
      }

      async function submitCreate() {
        hideAlert("create-alert");
        const title = document.getElementById("c-title").value.trim();
        const category = document.getElementById("c-category").value;
        const location = document.getElementById("c-location").value.trim();
        const date = document.getElementById("c-date").value;
        const time = document.getElementById("c-time").value;
        const max = parseInt(document.getElementById("c-max").value);
        const desc = document.getElementById("c-desc").value.trim();
        const btn = document.getElementById("create-btn");

        if (!title || !category || !location || !date || !time || !max) {
          showToast(
            "Please fill in all required fields before creating the activity.",
            "warning",
            4000,
            "Missing Fields",
          );
          return;
        }

        /* ── Past date/time guard ── */
        if (!isFutureDatetime(date, time)) {
          /* Prominent toast popup */
          showToast(
            "The date and time you selected are in the past. Activities must be scheduled for a future time.",
            "warning",
            6000,
            "⏰ Invalid Date & Time",
          );
          /* Also highlight fields */
          document.getElementById("c-date").classList.add("input-invalid");
          document.getElementById("c-time").classList.add("input-invalid");
          document.getElementById("datetime-hint").style.display = "";
          return;
        }

        setLoading(btn, true, "Creating…");
        try {
          await apiRequest("/activities", {
            method: "POST",
            body: JSON.stringify({
              title,
              category,
              location,
              date,
              time: time.length === 5 ? time + ":00" : time,
              max_participants: max,
              description: desc || null,
            }),
          });
          closeCreateModal();
          showToast(
            "Activity created successfully! 🎉",
            "success",
            3500,
            "Activity Created",
          );
          await loadActivities();
        } catch (err) {
          showAlert("create-alert", err.detail || "Could not create activity.");
          setLoading(btn, false);
        }
      }

      document
        .getElementById("create-modal")
        .addEventListener("click", function (e) {
          if (e.target === this) closeCreateModal();
        });

      init();
    </script>
  </body>
</html>
