<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Register — CircleUp</title>
    <link
      rel="stylesheet"
      href="./css/style.css"
    />
  </head>
  <body>
    <div class="auth-page">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="brand-icon">🌐</div>
          <h1>CircleUp</h1>
          <p>Create your account to get started.</p>
        </div>

        <div
          id="alert"
          class="alert"
        ></div>

        <form
          id="register-form"
          novalidate
        >
          <div class="form-group">
            <label
              class="form-label"
              for="name"
              >Full Name <span class="req">*</span></label
            >
            <input
              id="name"
              type="text"
              class="form-control"
              placeholder="Asha Verma"
              required
            />
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="email"
              >Email <span class="req">*</span></label
            >
            <input
              id="email"
              type="email"
              class="form-control"
              placeholder="asha@example.com"
              required
            />
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="password"
              >Password <span class="req">*</span></label
            >
            <input
              id="password"
              type="password"
              class="form-control"
              placeholder="Min 8 characters"
              required
              minlength="8"
            />
            <div class="form-hint">At least 8 characters.</div>
          </div>

          <div class="form-group">
            <label
              class="form-label"
              for="phone"
              >Phone Number <span class="req">*</span></label
            >
            <input
              id="phone"
              type="tel"
              class="form-control"
              placeholder="9876543210"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label
                class="form-label"
                for="city"
                >City</label
              >
              <input
                id="city"
                type="text"
                class="form-control"
                placeholder="Pune"
              />
            </div>
            <div
              class="form-group"
              style="grid-column: 1 / -1"
            >
              <label
                class="form-label"
                for="bio"
                >Bio</label
              >
              <textarea
                id="bio"
                class="form-control"
                placeholder="Tell others a bit about yourself…"
                rows="3"
              ></textarea>
            </div>
          </div>

          <button
            id="submit-btn"
            type="submit"
            class="btn btn-primary btn-full btn-lg"
            style="margin-top: 4px"
          >
            Create Account
          </button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="./login.html">Sign in</a>
        </div>
      </div>
    </div>

    <script src="./js/config.js"></script>
    <script src="./js/auth.js"></script>
    <script src="./js/api.js"></script>
    <script>
      redirectIfLoggedIn();

      document
        .getElementById("register-form")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          hideAlert("alert");

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value;
          const phone = document.getElementById("phone").value.trim();
          const city = document.getElementById("city").value.trim();
          const bio = document.getElementById("bio").value.trim();
          const btn = document.getElementById("submit-btn");

          if (!name || !email || !password || !phone) {
            return showAlert("alert", "Please fill in all required fields.");
          }
          if (password.length < 8) {
            return showAlert(
              "alert",
              "Password must be at least 8 characters.",
            );
          }

          setLoading(btn, true, "Creating account…");
          try {
            await apiRequest("/auth/register", {
              method: "POST",
              body: JSON.stringify({
                name,
                email,
                password,
                phone_number: phone,
                city: city || null,
                bio: bio || null,
              }),
            });
            // Auto-login after registration
            const loginData = await apiRequest("/auth/login", {
              method: "POST",
              body: JSON.stringify({ email, password }),
            });
            setToken(loginData.access_token);
            window.location.href = "./profile.html";
          } catch (err) {
            showAlert("alert", err.detail || "Registration failed.");
            setLoading(btn, false);
          }
        });
    </script>
  </body>
</html>
